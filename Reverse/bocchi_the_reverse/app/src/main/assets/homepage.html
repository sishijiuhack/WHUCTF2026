<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #fff;
            color: #111;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        main {
            width: min(92vw, 440px);
            padding: 28px 24px 30px;
            text-align: center;
        }

        img {
            display: block;
            width: min(100%, 320px);
            margin: 0 auto 20px;
        }

        p {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.7;
        }
    </style>
</head>
<body>
<main>
    <img src="file:///android_asset/ccs/ccs/start.png" alt="start">
    <p>可以帮我写作业吗？</p>
</main>
</body>
</html>
