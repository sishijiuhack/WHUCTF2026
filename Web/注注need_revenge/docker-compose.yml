services:
  web:
    build:
      context: ./app
    ports:
      - "8081:5000"
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ctf_challenge
      MYSQL_USER: ctf_user
      MYSQL_PASSWORD: ctf_pass
      GZCTF_FLAG: ${GZCTF_FLAG:-whuctf{default}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#2026!Rabbit_it_is_a_good_day}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-kaffuchinokawayi}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
