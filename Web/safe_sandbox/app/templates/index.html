<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Code Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #569cd6; }
        .container { max-width: 800px; margin: 0 auto; }
        textarea {
            width: 100%; height: 300px; background: #2d2d2d; color: #d4d4d4;
            border: 1px solid #444; padding: 12px; font-family: monospace;
            font-size: 14px; resize: vertical; border-radius: 4px;
        }
        textarea:focus { outline: none; border-color: #569cd6; }
        button {
            margin-top: 10px; padding: 10px 24px; background: #569cd6; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
            font-family: monospace;
        }
        button:hover { background: #4a8abf; }
        button:disabled { background: #555; cursor: not-allowed; }
        #output {
            margin-top: 16px; background: #2d2d2d; border: 1px solid #444;
            border-radius: 4px; padding: 12px; min-height: 80px;
            white-space: pre-wrap; font-size: 14px;
        }
        .error { color: #f44747; }
        .label { color: #888; margin-top: 12px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#x1f40d; Python Sandbox</h1>
        <p class="label">Code:</p>
        <textarea id="code" placeholder="print('Hello, world!')" spellcheck="false">print("Hello, world!")</textarea>
        <button id="run" onclick="runCode()">Run</button>
        <p class="label">Output:</p>
        <div id="output">Press Run to execute code.</div>
    </div>
    <script>
        async function runCode() {
            const btn = document.getElementById("run");
            const output = document.getElementById("output");
            const code = document.getElementById("code").value;
            btn.disabled = true;
            output.textContent = "Running...";
            output.className = "";
            try {
                const res = await fetch("/execute", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({code})
                });
                const data = await res.json();
                let text = "";
                if (data.stdout) text += data.stdout;
                if (data.stderr) text += data.stderr;
                if (data.error) {
                    text += data.error;
                    output.className = "error";
                }
                output.textContent = text || "(no output)";
            } catch (e) {
                output.textContent = "Request failed: " + e.message;
                output.className = "error";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
