[supervisord]
nodaemon=true
user=root

[program:ssrf]
command=/usr/bin/php -S 0.0.0.0:3000 -t /var/www/html
directory=/var/www/html
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nextjs]
command=/usr/local/bin/npm run start -- --hostname 127.0.0.1 --port 80
directory=/app/next-app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
