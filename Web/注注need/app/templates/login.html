{% extends "base.html" %}
{% block title %}登录 - 点兔图像站{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>用户登录</h1>
    <form method="post">
        <label>用户名
            <input type="text" name="username" placeholder="请输入用户名">
        </label>
        <label>密码
            <input type="password" name="password" placeholder="请输入密码">
        </label>
        <button type="submit">登录</button>
    </form>
    <p style="margin-top: 14px;">
        <a class="link-button" href="{{ url_for('register') }}">没有账号？请注册</a>
    </p>
</div>
{% endblock %}
