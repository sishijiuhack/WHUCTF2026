<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>注册</title>
    <style>
        :root { --line:#dadce0; --blue:#1a73e8; --bg:#f1f3f4; --text:#202124; --muted:#5f6368; }
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,"Segoe UI",sans-serif;background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:24px}
        .card{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 8px 24px rgba(60,64,67,.08)}
        h1{margin:0 0 6px;font-size:24px;color:var(--text)}
        .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
        .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
        label{font-size:13px;color:#3c4043}
        .input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
        .input:focus{outline:none;border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(26,115,232,.15)}
        .actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
        .btn{height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
        .btn:hover{background:#185abc}
        .link{font-size:14px;color:var(--blue);text-decoration:none}
        .link:hover{text-decoration:underline}
        .err{background:#fce8e6;border:1px solid #f6aea9;color:#a50e0e;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
    </style>
</head>
<body>
    <div class="card">
        <h1>注册邮箱账户</h1>
        <p class="sub">创建账户后即可使用邮件系统</p>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="field">
                <label for="username">用户名</label>
                <input id="username" class="input" name="username" required />
            </div>
            <div class="field">
                <label for="email">邮箱地址</label>
                <input id="email" class="input" name="email" required />
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" class="input" type="password" name="password" required />
            </div>
            <div class="actions">
                <a class="link" href="{{ url_for('login') }}">返回登录</a>
                <button class="btn" type="submit">完成注册</button>
            </div>
        </form>
    </div>
</body>
</html>
